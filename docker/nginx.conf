server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # hookline-api (roles, connections). Resolved lazily so the web container
    # starts even if the API isn't up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $hookline_api hookline-api:3000;
    location /api/ {
        proxy_pass http://$hookline_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        client_max_body_size 64k;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Runtime config and the HTML shell must never be cached.
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed Vite build output (e.g. index-AbC123xy.js) can be cached forever.
    location ~* "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback for react-router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
