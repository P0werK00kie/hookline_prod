# Appwrite gateway: replaces the upstream Traefik container so the stack
# doesn't need access to the Docker socket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS; resolve upstreams lazily so the gateway can start
    # before Appwrite is up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $appwrite_api      appwrite:80;
    set $appwrite_realtime appwrite-realtime:80;

    client_max_body_size 100m;
    proxy_buffering off;
    proxy_request_buffering off;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    location /v1/realtime {
        proxy_pass http://$appwrite_realtime;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://$appwrite_api;
        proxy_read_timeout 300s;
    }
}
