<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Primary Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snapgram - Share Your Moments</title>
    <meta name="title" content="Snapgram - Share Your Moments" />
    <meta
      name="description"
      content="Connect with friends and share your favorite moments. Snapgram is a modern social media platform for photo sharing, discovering new content, and staying connected with your community."
    />
    <meta
      name="keywords"
      content="social media, photo sharing, snapgram, instagram alternative, share photos, social network, connect with friends"
    />
    <meta name="author" content="Snapgram" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://snapgram.app/" />
    <meta property="og:title" content="Snapgram - Share Your Moments" />
    <meta
      property="og:description"
      content="Connect with friends and share your favorite moments. Snapgram is a modern social media platform for photo sharing, discovering new content, and staying connected with your community."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://snapgram.app/" />
    <meta property="twitter:title" content="Snapgram - Share Your Moments" />
    <meta
      property="twitter:description"
      content="Connect with friends and share your favorite moments. Snapgram is a modern social media platform for photo sharing, discovering new content, and staying connected with your community."
    />
    <meta property="twitter:image" content="/og-image.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#877EFF" />
    <meta name="msapplication-TileColor" content="#877EFF" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Snapgram",
        "description": "Connect with friends and share your favorite moments. Snapgram is a modern social media platform for photo sharing, discovering new content, and staying connected with your community.",
        "url": "https://snapgram.app/",
        "applicationCategory": "SocialNetworkingApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.8",
          "ratingCount": "1250"
        }
      }
    </script>
    <!-- Runtime config (overwritten by the Docker container at startup) -->
    <script src="/env-config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
